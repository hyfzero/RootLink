# RootLink RV1106 Stage 2 统一配置
# 格式严格为 KEY=VALUE；不要加引号，不支持行尾注释。真实 API 密钥禁止写入本文件。

# ---------------------------- 构建选择 ----------------------------
# simulator：在电脑运行；rv1106：用 Echo-Mate SDK 交叉编译 32 位 ARM 程序。
TARGET=simulator
# simulated：确定性静音/语音测试源，不访问声卡；alsa：真实 ALSA 麦克风和扬声器。
AUDIO_API=simulated
# mock：离线固定 ASR/LLM/TTS；cloud：真实调用国内云服务并启用 curl/TLS。
SERVICE_MODE=mock
BUILD_TYPE=Release
BUILD_TESTS=ON
# 留空时自动使用 build/<目标>-<音频>-<服务>。
BUILD_DIR=
# 推荐通过同名环境变量指定；这里留空可避免把本机 SDK 路径提交到仓库。
RV1106_SDK_ROOT=

# 合法生产组合：simulator+simulated+mock、simulator+alsa+cloud、rv1106+alsa+cloud。
CAPTURE_DEVICE=default
PLAYBACK_DEVICE=default
BUFFER_FRAMES=100

# UI_BACKEND 启用时，回复文字每个 Unicode 字符的显示间隔，范围 10..1000 ms。
UI_TEXT_INTERVAL_MS=50

# ---------------------------- 国内 ASR ----------------------------
ASR_PROVIDER=dashscope
ASR_MODEL=qwen3-asr-flash
ASR_BASE_URL=https://dashscope.aliyuncs.com/compatible-mode/v1

# ---------------------------- 国内 LLM ----------------------------
# 可填 qwen、deepseek、glm、moonshot/kimi 或 minimax。模型名称完全由配置决定。
# base_url、headers、auth_header 和兼容 api_key 可从 RootLink models.json 读取。
LLM_PROVIDER=qwen
LLM_MODEL=qwen-plus
# 通常不设置此项，按所选 provider 读取 models.json 的地址；Qwen 自带缺省地址。
# 只有需要覆盖 models.json 时才取消下一行注释，切换 provider 时也要同步改地址。
# LLM_BASE_URL=https://dashscope.aliyuncs.com/compatible-mode/v1
# 仿真默认使用项目内相对路径；板端建议改为 /data/rootlink/config/models.json。
MODELS_FILE=config/models.json

# ---------------------------- 国内 TTS ----------------------------
TTS_PROVIDER=dashscope
TTS_MODEL=cosyvoice-v3-flash
TTS_VOICE=longanyang
TTS_SAMPLE_RATE=16000
TTS_BASE_URL=https://dashscope.aliyuncs.com/api/v1

# ---------------------------- 角色和会话 ----------------------------
# 仿真路径可直接体验；部署时分别改为 /data/rootlink/roles/default 和
# /data/rootlink/sessions，或用同名环境变量覆盖。
ROLE_DIR=config/role-example
SESSION_DIR=build/runtime-sessions
HISTORY_TURNS=8
HISTORY_TOKEN_BUDGET=12000

# ---------------------------- 本地自适应 VAD ----------------------------
# 连续 3 帧（60ms）超过动态阈值才启动，避免单次撞击声误触发。
VAD_START_FRAMES=3
# 开始点前保留 400ms，避免吞掉句首弱音。
VAD_PRE_ROLL_MS=400
# 句中自然停顿达到 800ms 才结束。
VAD_END_SILENCE_MS=800
VAD_MIN_UTTERANCE_MS=300
VAD_MAX_UTTERANCE_MS=30000
VAD_MIN_RMS=250
VAD_NOISE_MULTIPLIER=3.0
# 仅非语音阶段更新噪声 EWMA；值越小越稳定，值越大适应环境变化越快。
VAD_NOISE_ALPHA=0.02

# ---------------------------- 网络与安全边界 ----------------------------
# 密钥文件只写 KEY=VALUE，Linux 权限推荐 600；环境变量的优先级更高。
SECRETS_FILE=config/rootlink-secrets.env
CONNECT_TIMEOUT_MS=5000
ASR_TIMEOUT_MS=45000
LLM_TIMEOUT_MS=60000
TTS_TIMEOUT_MS=45000
# 仅连接失败、429、5xx 且尚未收到有效正文时重试一次。
RETRY_COUNT=1
