# RootLink RV1106 Phase 1 统一构建配置
#
# 使用方式：编辑本文件后，在 Linux / WSL 中执行：
#   sh embedded/rv1106/scripts/build.sh
#
# 语法限制：每行必须是 KEY=VALUE；等号两侧不要加空格；注释必须独占一行。

# 构建目标：
#   simulator = 当前电脑原生程序，便于没有板卡时调试
#   rv1106    = 32 位 ARM 开发板程序，需要外部 Echo-Mate RV1106 SDK
TARGET=simulator

# 音频 API：
#   simulated = 仿真输入/输出。输入生成 200 Hz 测试波，输出只按实时速度消费。
#   alsa      = Linux/RV1106 的真实麦克风和扬声器。
#
# 合法组合：simulator+simulated、simulator+alsa、rv1106+alsa。
# Windows 原生构建请选择 simulated；Windows 上的真实 ALSA 请在 WSL/Linux 构建。
AUDIO_API=simulated

# CMake 构建类型：Release（板端/验收推荐）或 Debug（本机排错推荐）。
BUILD_TYPE=Release

# 是否构建纯逻辑单元测试：ON 或 OFF。RV1106 交叉构建会强制为 OFF。
BUILD_TESTS=ON

# 可选输出目录。留空时自动使用 build/<TARGET>-<AUDIO_API>。
BUILD_DIR=

# 外部 Echo-Mate rv1106-sdk 的绝对路径，仅 TARGET=rv1106 时使用。
# 也可留空并在终端设置 RV1106_SDK_ROOT；SDK 和产物不会提交进 RootLink。
RV1106_SDK_ROOT=

# CLI 运行时默认值。它们会在编译时写入 rootlink-audio-smoke，但仍可被每次运行的
# --capture-device、--playback-device、--buffer-frames 参数覆盖。
CAPTURE_DEVICE=default
PLAYBACK_DEVICE=default
BUFFER_FRAMES=100

# Phase 1 固定音频协议（仅用于说明，不允许通过配置修改）：
# 16000 Hz / 单声道 / PCM S16_LE / 20 ms / 320 samples / 640 bytes。
# ASR、LLM、TTS、VAD、唤醒词和网络 API 属于后续阶段，本配置暂不接受其密钥。
