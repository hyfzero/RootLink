name: Release Windows and Android

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  APP_ARTIFACT: RootLink
  FLUTTER_VERSION: 3.41.4

jobs:
  verify:
    name: Analyze and test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      build_number: ${{ steps.version.outputs.build_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Read and validate version
        id: version
        shell: bash
        run: |
          package_version="$(sed -nE 's/^version:[[:space:]]*([^+[:space:]]+)\+([0-9]+).*$/\1/p' pubspec.yaml)"
          build_number="$(sed -nE 's/^version:[[:space:]]*([^+[:space:]]+)\+([0-9]+).*$/\2/p' pubspec.yaml)"
          test -n "$package_version" && test -n "$build_number"
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "v${package_version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match pubspec.yaml version v${package_version}."
            exit 1
          fi
          echo "version=${package_version}" >> "$GITHUB_OUTPUT"
          echo "build_number=${build_number}" >> "$GITHUB_OUTPUT"
      - run: flutter pub get
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

  windows:
    name: Windows release
    runs-on: windows-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build Windows app
        run: flutter build windows --release
      - name: Smoke test Windows app
        shell: pwsh
        run: |
          $exe = Resolve-Path "build/windows/x64/runner/Release/RootLink.exe"
          $process = Start-Process -FilePath $exe -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 8
          if ($process.HasExited) {
            throw "Windows app exited during smoke test with code $($process.ExitCode)"
          }
          Stop-Process -Id $process.Id -Force
      - name: Archive Windows app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Compress-Archive `
            -Path "build/windows/x64/runner/Release/*" `
            -DestinationPath "dist/${{ env.APP_ARTIFACT }}-v${{ needs.verify.outputs.version }}-windows.zip" `
            -Force
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_ARTIFACT }}-windows
          path: dist/${{ env.APP_ARTIFACT }}-v${{ needs.verify.outputs.version }}-windows.zip
          if-no-files-found: error

  android:
    name: Signed Android APK
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Restore Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/rootlink-release.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/rootlink-release.jks" \
            "$ANDROID_KEYSTORE_PASSWORD" \
            "$ANDROID_KEY_ALIAS" \
            "$ANDROID_KEY_PASSWORD" > android/key.properties
      - name: Build signed APK
        run: flutter build apk --release
      - name: Prepare Android artifact
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
            "dist/${APP_ARTIFACT}-v${{ needs.verify.outputs.version }}-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_ARTIFACT }}-android
          path: dist/${{ env.APP_ARTIFACT }}-v${{ needs.verify.outputs.version }}-android.apk
          if-no-files-found: error

  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [verify, windows, android]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-artifacts/*
          fail_on_unmatched_files: true
