name: Release Windows and Android

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  APP_PRODUCT: RootLink
  APP_ARTIFACT: RootLink
  APP_BUNDLE_ID: com.amadues.companion

jobs:
  prepare:
    name: Read release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      build_number: ${{ steps.version.outputs.build_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read and validate version
        id: version
        shell: bash
        run: |
          version="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
          build_number="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['tool']['flet']['build_number'])")"
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match pyproject.toml version v${version}."
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "build_number=${build_number}" >> "$GITHUB_OUTPUT"

  windows:
    name: Windows
    runs-on: windows-latest
    needs: prepare
    env:
      BUILD_VERSION: ${{ needs.prepare.outputs.version }}
      BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Build Windows app
        run: >
          uv run flet pack main.py
          --onedir
          --name ${{ env.APP_ARTIFACT }}
          --product-name "${{ env.APP_PRODUCT }}"
          --product-version ${{ env.BUILD_VERSION }}
          --file-version ${{ env.BUILD_VERSION }}.${{ env.BUILD_NUMBER }}
          --bundle-id ${{ env.APP_BUNDLE_ID }}
          --distpath build/windows
          --add-data resource:resource assets:assets
          --pyinstaller-build-args=--paths=src
          --yes

      - name: Smoke test Windows app
        shell: pwsh
        run: |
          $exe = Resolve-Path "build/windows/${{ env.APP_ARTIFACT }}/${{ env.APP_ARTIFACT }}.exe"
          $process = Start-Process -FilePath $exe -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 8
          if ($process.HasExited) {
            throw "Windows app exited during smoke test with code $($process.ExitCode)"
          }
          & taskkill.exe /PID $process.Id /T /F
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to stop the Windows smoke-test process tree."
          }

      - name: Archive Windows app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Start-Sleep -Seconds 5
          Compress-Archive `
            -Path "build/windows/${{ env.APP_ARTIFACT }}" `
            -DestinationPath "dist/${{ env.APP_ARTIFACT }}-v${{ env.BUILD_VERSION }}-windows.zip" `
            -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_ARTIFACT }}-windows
          path: dist/${{ env.APP_ARTIFACT }}-v${{ env.BUILD_VERSION }}-windows.zip
          if-no-files-found: error

  android:
    name: Android APK
    runs-on: ubuntu-latest
    needs: prepare
    env:
      BUILD_VERSION: ${{ needs.prepare.outputs.version }}
      BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Validate Android signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "Missing ANDROID_KEYSTORE_BASE64 secret" && exit 1)
          test -n "$ANDROID_KEYSTORE_PASSWORD" || (echo "Missing ANDROID_KEYSTORE_PASSWORD secret" && exit 1)
          test -n "$ANDROID_KEY_PASSWORD" || (echo "Missing ANDROID_KEY_PASSWORD secret" && exit 1)
          test -n "$ANDROID_KEY_ALIAS" || (echo "Missing ANDROID_KEY_ALIAS secret" && exit 1)

      - name: Restore Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/android-signing"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/android-signing/release.jks"

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null

      - name: Build Android APK
        env:
          FLET_ANDROID_SIGNING_KEY_STORE: ${{ runner.temp }}/android-signing/release.jks
          FLET_ANDROID_SIGNING_KEY_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          FLET_ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          FLET_ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: >
          uv run flet build apk .
          --yes
          --module-name main
          --product "${{ env.APP_PRODUCT }}"
          --artifact ${{ env.APP_ARTIFACT }}
          --bundle-id ${{ env.APP_BUNDLE_ID }}
          --build-version ${{ env.BUILD_VERSION }}
          --build-number ${{ env.BUILD_NUMBER }}
          --exclude .git .venv .pytest_cache build dist docs figma openclaw __pycache__

      - name: Prepare Android artifact
        run: |
          mkdir -p dist
          cp "build/apk/${APP_ARTIFACT}.apk" "dist/${APP_ARTIFACT}-v${BUILD_VERSION}-android.apk"

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_ARTIFACT }}-android
          path: dist/${{ env.APP_ARTIFACT }}-v${{ env.BUILD_VERSION }}-android.apk
          if-no-files-found: error

  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs:
      - prepare
      - windows
      - android
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-artifacts/*
          fail_on_unmatched_files: true

  gitee-release:
    name: Gitee Release Mirror
    needs:
      - prepare
      - github-release
    if: startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/sync-gitee-release.yml
    with:
      tag: ${{ github.ref_name }}
      use_workflow_artifacts: true
    secrets: inherit
