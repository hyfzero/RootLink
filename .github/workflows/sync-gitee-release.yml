name: Sync Gitee Release

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub release tag to mirror
        required: true
        default: v0.1.9
        type: string

permissions:
  contents: read

jobs:
  mirror:
    name: Mirror to Gitee
    runs-on:
      - self-hosted
      - rootlink-release-cn
    timeout-minutes: 90
    concurrency:
      group: gitee-release-${{ github.event.release.tag_name || inputs.tag }}
      cancel-in-progress: false
    env:
      GITEE_REPO: RootLink
      GITEE_TOKEN: ${{ secrets.GITEE_RELEASE }}
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Validate inputs
        shell: bash
        run: |
          test -n "$GITEE_TOKEN" || (echo "Missing GITEE_RELEASE secret" && exit 1)
          [[ "$RELEASE_TAG" == v* ]] || (echo "Release tag must start with v" && exit 1)

      - name: Download sync script
        shell: bash
        run: |
          curl --fail --silent --show-error \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/.github/scripts/sync-gitee-release.sh?ref=${GITHUB_SHA}" |
            jq --raw-output '.content' |
            tr -d '\n' |
            base64 --decode > sync-gitee-release.sh
          bash -n sync-gitee-release.sh

      - name: Download existing GitHub release
        shell: bash
        run: |
          mkdir -p release-artifacts
          base_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}"
          curl --fail --location --retry 8 --retry-all-errors \
            --output "release-artifacts/RootLink-${RELEASE_TAG}-android.apk" \
            "${base_url}/RootLink-${RELEASE_TAG}-android.apk" &
          apk_pid=$!
          curl --fail --location --retry 8 --retry-all-errors \
            --output "release-artifacts/RootLink-${RELEASE_TAG}-windows.zip" \
            "${base_url}/RootLink-${RELEASE_TAG}-windows.zip" &
          windows_pid=$!
          wait "$apk_pid"
          wait "$windows_pid"

      - name: Sync release to Gitee
        shell: bash
        run: bash sync-gitee-release.sh
