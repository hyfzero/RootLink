[project]
name = "amadues"
version = "0.1.9"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "certifi==2026.2.25",
    "charset-normalizer==2.1.1",
    "flet==0.84.0",
    "idna==3.11",
    "Pillow==11.1.0",
    "requests==2.33.1",
    "urllib3==2.6.3",
]

[dependency-groups]
dev = [
    "flet[all]>=0.84.0",
    "pyinstaller>=6.20.0",
    "pytest>=9.0.3",
]

[tool.flet]
product = "RootLink"
artifact = "RootLink"
org = "com.amadues"
bundle_id = "com.amadues.companion"
build_number = 113

[tool.flet.app]
path = "."
module = "main"
exclude = [
    ".git",
    ".venv",
    ".pytest_cache",
    "build",
    "dist",
    "docs",
    "figma",
    "openclaw",
    "__pycache__",
]
