[project]
name = "amadues"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flet[all]>=0.84.0",
    "Pillow>=10.0.0",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.20.0",
    "pytest>=9.0.3",
]

[tool.flet]
product = "Amadues Companion"
artifact = "AmaduesCompanion"
org = "com.amadues"
bundle_id = "com.amadues.companion"

[tool.flet.app]
path = "."
module = "main"
exclude = [
    ".git",
    ".venv",
    ".pytest_cache",
    "build",
    "dist",
    "docs",
    "figma",
    "openclaw",
    "__pycache__",
]
